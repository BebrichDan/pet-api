[project]
name = "pet-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Dan Per",email = "bebrich66@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio (>=4.11.0,<5.0.0)",
    "fastapi (>=0.121.1,<0.122.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "bcrypt (<4.0.0)"
]

[tool.poetry.scripts]
pet-api = "src.main:main"

[tool.poetry]
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79            
select = ["E", "F", "I"]    # категории проверок (Errors, Flake8, Imports)
extend-select = ["W"]       # по правилам pycodestyle (W),